media:
  input: public/images
  output: /images

content:
  - name: faqs
    label: Faqs
    type: collection
    path: src/content/faqs
    format: yaml-frontmatter

    fields:
      - name: author
        label: Client name
        type: string
        required: true

      - name: role
        label: Role
        type: string

      - name: company
        label: Company / client source
        type: string

      - name: location
        label: Location
        type: string

      - name: rating
        label: Rating
        type: number

      - name: featured
        label: Featured testimonial
        type: boolean

      - name: order
        label: Display order
        type: number

      - name: project
        label: Project
        type: string

      - name: date
        label: Date
        type: date

      - name: quote
        label: Short quote
        type: text

      - name: body
        label: Full testimonial
        type: rich-text

    view:
      primary: author
      fields: [author, project, rating, featured, order]
      sort: [order, author]
      default:
        sort: order
        order: asc
