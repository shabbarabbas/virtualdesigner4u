media:
  input: public/images
  output: /images
content:
  - name: Faqs
    label: Faqs
    type: collection
    path: src/content/faqs
    filename: "{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: author
        label: author
        type: string
        required: true

      - name: role
        label: role
        type: text

      - name: company
        label: company
        type: text

      - name: rating
        label: rating
        type: number

      - name: featured
        label: featured
        type: text

      - name: order
        label: order
        type: text

      - name: project
        label: project
        type: text
        
      - name: quote
        label: Content
        type: rich-text
        
      - name: date
        label: Date
        type: date
        
    view:
      fields: [name, company, date]
      primary: name
      sort: [date, name]
      default:
        sort: date
        order: desc