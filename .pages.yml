media:
  input: public/images
  output: /images

content:
  - name: testimonials
    label: Testimonials
    type: collection
    path: src/content/testimonials
    format: yaml-frontmatter

    fields:
      - name: author
        label: Client name
        type: string
        required: true

      - name: role
        label: Role
        type: string

      - name: company
        label: Company / client source
        type: string

      - name: location
        label: Location
        type: string

      - name: rating
        label: Rating
        type: number

      - name: featured
        label: Featured testimonial
        type: boolean

      - name: order
        label: Display order
        type: number

      - name: project
        label: Project
        type: string

      - name: date
        label: Date
        type: date

      - name: quote
        label: Short quote
        type: text

      - name: body
        label: Full testimonial
        type: rich-text

    view:
      primary: author
      fields: [author, project, rating, featured, order]
      sort: [order, author]
      default:
        sort: order
        order: asc
        
  - name: services
    label: Services
    type: collection
    path: src/content/services
    format: yaml-frontmatter

    fields:
      - name: title
        label: Service title
        type: string
        required: true

      - name: summary
        label: Short summary
        type: text

      - name: description
        label: Description
        type: text

      - name: icon
        label: Icon name
        type: string

      - name: group
        label: Service group
        type: string

      - name: order
        label: Display order
        type: number

      - name: featured
        label: Featured service
        type: boolean

      - name: startingAt
        label: Starting price
        type: string

      - name: timeline
        label: Estimated timeline
        type: string

      - name: benefits
        label: Benefits
        type: string
        list: true

      - name: technologies
        label: Technologies
        type: string
        list: true

      - name: deliverables
        label: Deliverables
        type: string
        list: true

      - name: body
        label: Full service content
        type: rich-text

    view:
      primary: title
      fields: [title, group, order, featured]
      sort: [order, title]
      default:
        sort: order
        order: asc