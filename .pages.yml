media:
  input: public/images
  output: /images
content:
  - name: pages
    label: Pages
    type: collection
    path: src/content
    filename: "{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: body
        label: Content
        type: rich-text