media:
  input: public/images
  output: /images

content:
  - name: testimonials
    label: Testimonials
    type: collection
    path: src/content/testimonials
    format: yaml-frontmatter

    fields:
      - name: author
        label: Client name
        type: string
        required: true

      - name: role
        label: Role
        type: string

      - name: company
        label: Company / client source
        type: string

      - name: location
        label: Location
        type: string

      - name: rating
        label: Rating
        type: number

      - name: featured
        label: Featured testimonial
        type: boolean

      - name: order
        label: Display order
        type: number

      - name: project
        label: Project
        type: string

      - name: date
        label: Date
        type: date

      - name: quote
        label: Short quote
        type: text

      - name: body
        label: Full testimonial
        type: rich-text

    view:
      primary: author
      fields: [author, project, rating, featured, order]
      sort: [order, author]
      default:
        sort: order
        order: asc
        
  - name: services
    label: Services
    type: collection
    path: src/content/services
    format: yaml-frontmatter

    fields:
      - name: title
        label: Service title
        type: string
        required: true

      - name: summary
        label: Short summary
        type: text

      - name: description
        label: Description
        type: text

      - name: icon
        label: Icon name
        type: string

      - name: group
        label: Service group
        type: string

      - name: order
        label: Display order
        type: number

      - name: featured
        label: Featured service
        type: boolean

      - name: startingAt
        label: Starting price
        type: string

      - name: timeline
        label: Estimated timeline
        type: string

      - name: benefits
        label: Benefits
        type: string
        list: true

      - name: technologies
        label: Technologies
        type: string
        list: true

      - name: deliverables
        label: Deliverables
        type: string
        list: true

      - name: body
        label: Full service content
        type: rich-text

    view:
      primary: title
      fields: [title, group, order, featured]
      sort: [order, title]
      default:
        sort: order
        order: asc

        
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter

    fields:
      - name: title
        label: Project title
        type: string
        required: true

      - name: summary
        label: Short summary
        type: text

      - name: description
        label: Description
        type: text

      - name: category
        label: Category
        type: string

      - name: tags
        label: Tags
        type: string
        list: true

      - name: tech
        label: Technologies
        type: string
        list: true

      - name: client
        label: Client
        type: string

      - name: industry
        label: Industry
        type: string

      - name: role
        label: Your role
        type: string

      - name: duration
        label: Duration
        type: string

      - name: year
        label: Year
        type: number

      - name: order
        label: Display order
        type: number

      - name: featured
        label: Featured project
        type: boolean

      - name: accent
        label: Accent colour (hex)
        type: string

      - name: cover
        label: Cover image
        type: image

      - name: coverAlt
        label: Cover image alt text
        type: string

      - name: gallery
        label: Project gallery
        type: object
        list: true
        fields:
          - name: src
            label: Image
            type: image

          - name: alt
            label: Alt text
            type: string

          - name: caption
            label: Caption
            type: text

      - name: links
        label: Project links
        type: object
        fields:
          - name: live
            label: Live project URL
            type: string

      - name: problem
        label: The problem
        type: text

      - name: solution
        label: The solution
        type: text

      - name: features
        label: Key features
        type: string
        list: true

      - name: challenges
        label: Challenges
        type: object
        list: true
        fields:
          - name: title
            label: Challenge title
            type: string

          - name: detail
            label: Challenge details
            type: text

      - name: results
        label: Results
        type: object
        list: true
        fields:
          - name: metric
            label: Metric
            type: string

          - name: label
            label: Metric label
            type: string

          - name: detail
            label: Supporting details
            type: text

      - name: lessons
        label: Lessons learned
        type: string
        list: true

      - name: testimonial
        label: Client testimonial
        type: object
        fields:
          - name: quote
            label: Quote
            type: text

          - name: author
            label: Author
            type: string

          - name: role
            label: Role / organisation
            type: string

      - name: body
        label: Full case study
        type: rich-text

    view:
      primary: title
      fields: [title, category, year, order, featured]
      sort: [order, title]
      default:
        sort: order
        order: asc


  - name: blog
    label: Blog posts
    type: collection
    path: src/content/posts
    format: yaml-frontmatter

    fields:
      - name: title
        label: Post title
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: publishDate
        label: Publish date
        type: date
        options:
          format: yyyy-MM-dd

      - name: category
        label: Category
        type: string

      - name: tags
        label: Tags
        type: string
        list: true

      - name: cover
        label: Cover image
        type: image

      - name: coverAlt
        label: Cover image alt text
        type: string

      - name: featured
        label: Featured post
        type: boolean

      - name: body
        label: Article content
        type: rich-text

    view:
      primary: title
      fields: [title, publishDate, category, featured]
      sort: [publishDate, title]
      default:
        sort: publishDate
        order: desc

  - name: site-personal-settings
    label: Site Personal settings
    type: file
    path: src/config/personal.json
    format: json
    
    fields:
      - name: personal
        label: Personal information
        type: object
        readonly: true
        fields:
          - name: firstName
            label: First name
            type: string

          - name: lastName
            label: Last name
            type: string

          - name: fullName
            label: Full name
            type: string

          - name: role
            label: Role
            type: string

          - name: jobTitle
            label: Job title
            type: string

          - name: location
            label: Location
            type: string

          - name: timezone
            label: Timezone
            type: string

          - name: email
            label: Email address
            type: string

          - name: phone
            label: Phone number
            type: string

          - name: photo
            label: Profile photo
            type: image

          - name: photoAlt
            label: Profile photo alt text
            type: string

          - name: resume
            label: Resume URL or file path
            type: string

          - name: availability
            label: Availability
            type: object
            fields:
              - name: open
                label: Available for new projects
                type: boolean

              - name: label
                label: Availability label
                type: string

              - name: detail
                label: Availability details
                type: text

          - name: responseTime
            label: Response time
            type: string

          - name: short
            label: Short bio
            type: text

          - name: intro
            label: Introduction
            type: text

          - name: story
            label: Your story — paragraphs
            type: text
            list: true

          - name: pitch
            label: Client pitch
            type: text

      - name: stats
        label: Statistics
        type: object
        list: true
        fields:
          - name: value
            label: Numeric value
            type: number

          - name: suffix
            label: Suffix
            type: string

          - name: label
            label: Label
            type: string

          - name: description
            label: Description
            type: text

      - name: socials
        label: Social links
        type: object
        list: true
        fields:
          - name: label
            label: Platform name
            type: string

          - name: href
            label: URL
            type: string

          - name: icon
            label: Icon name
            type: string

          - name: handle
            label: Display handle
            type: string

      - name: values
        label: Values
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string

          - name: description
            label: Description
            type: text

          - name: icon
            label: Icon name
            type: string

      - name: process
        label: Working process
        type: object
        list: true
        fields:
          - name: step
            label: Step number
            type: string

          - name: title
            label: Step title
            type: string

          - name: description
            label: Description
            type: text

          - name: deliverables
            label: Deliverables
            type: string
            list: true

      - name: toolkit
        label: Toolkit
        type: object
        list: true
        fields:
          - name: group
            label: Group name
            type: string

          - name: items
            label: Tools
            type: string
            list: true

      - name: industries
        label: Industries served
        type: string
        list: true